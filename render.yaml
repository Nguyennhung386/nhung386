# Render Blueprint for the SaveTok download service (services/download_api.py).
# The SaveTok frontend itself is deployed separately (Vercel / Lovable).
services:
  - type: web
    name: savetok-api
    runtime: python
    plan: free
    rootDir: services
    buildCommand: pip install -r requirements.txt
    startCommand: python download_api.py
    healthCheckPath: /api/dl/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Comma-separated frontend URLs allowed to call the API, e.g. https://savetok.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
